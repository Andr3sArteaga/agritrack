services:
  db:
    image: postgres:16-alpine
    container_name: agritrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agritrack
      POSTGRES_PASSWORD: agritrack
      POSTGRES_DB: agritrack
    ports:
      - "5433:5432"
    volumes:
      - agritrack_data:/var/lib/postgresql/data

volumes:
  agritrack_data: